<script>const DEFAULT_STATE=/*STATE_START*/{"songs":[{"id":"song-1","title":"Dagny","artist":"Owe Törnquist","blocks":[{"type":"line","text":"Inte visste vi var kärlek var förr’n lilla Dagny kom till stan,"},{"type":"line","text":"nu sitter vi där och doppar skorporna på ”Kaffe sjuan” hela dan"},{"type":"line","text":"och alla så ropar vi i kör att:"},{"type":"chorus","lines":["Dagny, kom hit och spill,","oh, oh, oh, Dagny, fem droppar till.","Hör hur mitt hjärta sjunger trall, dill, dill."]},{"type":"line","text":"Solbrun gick hon mellan våra bord, ja, hon var nästan alldeles svart."},{"type":"line","text":"Vi satt och tryckte på små kärleksord men liksom kom ej någon vart,"},{"type":"line","text":"för så fort nå’n försökte skrek dom andra:"},{"type":"chorus","lines":["Dagny, kom hit och spill...","oh, oh, oh, Dagny, fem droppar till.","Hör hur mitt hjärta sjunger trall, dill, dill."]},{"type":"line","text":"Vi spelade på grammofonen där och titta’ snett uppå varann,"},{"type":"line","text":"wienerbröna, mazarinerna och sockerkakorna försvann"},{"type":"line","text":"i fyra små feta killar som sjöng:"},{"type":"chorus","lines":["Dagny, kom hit och spill...","oh, oh, oh, Dagny, fem droppar till.","Hör hur mitt hjärta sjunger trall, dill, dill."]},{"type":"line","text":"Allting kanske hade slutat bra om inte Dagny sagt en dag:"},{"type":"line","text":"”Hejsan älsklingar, nu bjuder jag och ni får ta vad ni vill ha.”"},{"type":"line","text":"Oj, oj, vad vi svällde upp på grund av:"},{"type":"chorus","lines":["Dagny, kom hit och spill...","oh, oh, oh, Dagny, fem droppar till.","Hör hur mitt hjärta sjunger trall, dill, dill."]},{"type":"line","text":"I saligt rus av hennes vackra ord vi glömde bort att säga tack,"},{"type":"line","text":"vi åt och drack så allihopa sprack och i tapeten sa det smack!"},{"type":"line","text":"Ruinerna sjunger ännu därom:"},{"type":"chorus","lines":["Dagny, kom hit och spill...","oh, oh, oh, Dagny, fem droppar till.","Hör hur mitt hjärta sjunger trall, dill,"]},{"type":"line","text":"Hör hur mitt hjärta sjunger trall, dill,"},{"type":"line","text":"Hör hur mitt hjärta sjunger trall, dill, dill."}]},{"id":"song-2","title":"En fattig bonddräng","artist":"Astrid Lindgren","blocks":[{"type":"line","text":"Jag är fattig bonddräng, men jag lever ändå."},{"type":"line","text":"Dagar går och kommer, medan jag knogar på."},{"type":"line","text":"Harvar, sår och plöjer, mockar, gräver och bär."},{"type":"line","text":"Går bak mina oxar, hojtar visslar och svär."},{"type":"line","text":"Jag är fattig bonddräng, och jag tuggar mitt snus."},{"type":"line","text":"Och när lörda'n kommer, vill jag ta mig ett rus."},{"type":"line","text":"Sen, när jag blitt livad vill jag tampas och slåss."},{"type":"line","text":"Vila hos en flicka vill jag också, förstås."},{"type":"line","text":"Sen, då kommer sönda'n, och då vill våran präst,"},{"type":"line","text":"att jag ska i kyrkan, men då sover jag mest."},{"type":"line","text":"Prästen kan väl sova hela måndagen men,"},{"type":"line","text":"för en fattig bonddräng, börjar knoget igen."},{"type":"line","text":"Så går hela veckan, alla dagar och år."},{"type":"line","text":"Jag går med min lie, och jag plöjer och sår."},{"type":"line","text":"Jag kör mina oxar och jag hässjar mitt hö."},{"type":"line","text":"Harvar, gnor och trälar, och till sist ska jag dö."},{"type":"line","text":"Står där, fattig bonddräng invid Himmelens port."},{"type":"line","text":"Lite rädd och ledsen för de synder jag gjort."},{"type":"line","text":"Man ska inte supa, hålls med flickor och slåss."},{"type":"line","text":"Herren, Gud i Himlen, är väl missnöjd förstås."},{"type":"line","text":"Men, då säger Herren: Fattig bonddräng, kom hit."},{"type":"line","text":"Jag har sett din strävan och ditt eviga slit."},{"type":"line","text":"Därför, fattig bonddräng, är Du välkommen här."},{"type":"line","text":"Därför, fattig bonddräng, skall Du vara mig när."},{"type":"line","text":"Åh, jag, fattig bonddräng står så still inför Gud."},{"type":"line","text":"Och sen klär han på mig den mest snövita skrud."},{"type":"line","text":"Nu Du, säger Herren, är ditt arbete slut."},{"type":"line","text":"Nu Du, fattig bonddräng, nu får Du vila ut."}]},{"id":"song-3","title":"En kväll i Juni","artist":"Lasse Berghagen","blocks":[{"type":"line","text":"Ja det var en kväll i juni då när sommar'n är som bäst"},{"type":"line","text":"hon dansade för morfar som hon gillar allra mest"},{"type":"line","text":"Hennes morfar satt och nynna på en sommarmelodi"},{"type":"line","text":"plötsligt spratt det till i gubben, han blev ung och han blev fri - i"},{"type":"chorus","lines":["Han tog av sig sin kavaj, sparka av sig båda skorna","Och så spotta' han ut snuset, sa \"min sköna, får jag lov?\"","Hon var vacker han var stolt, rak i ryggen som en fura","Det var sommmar det var glädje och dom dansade och sjöng","La La La La La La La La La La La La La La La","La La La La La La La La La La La La La La La"]},{"type":"line","text":"Så mindes han och sa"},{"type":"line","text":"Ja du skulle sett din mormor hon var lika grann som du"},{"type":"line","text":"när hon dansade i gräset likadant som du gör nu"},{"type":"line","text":"Hennes hår var blekt av solen, hennes mun av smultron röd"},{"type":"line","text":"hon var ljuv liksom en lilja, hennes kärlek var som glö - öd"},{"type":"chorus","lines":["Så jag tog av mig min kavaj, sparka av mig båda skorna","och så spotta' jag ut snuset, sa \"min sköna, får jag lov?\"","Hon var vacker jag var stolt, rak i ryggen som en fura","Det var sommmar det var glädje och vi dansade och sjöng","La La La La La La La La La La La La La La La","La La La La La La La La La La La La La La La"]}]},{"id":"song-4","title":"Hooked on a feeling","artist":"Blue Swede","blocks":[{"type":"line","text":"Ooga Chuka Ooga Ooga"},{"type":"line","text":"Ooga Chuka Ooga Ooga"},{"type":"line","text":"Ooga Chuka Ooga Ooga"},{"type":"line","text":"Ooga Chuka Ooga Ooga"},{"type":"line","text":"I can't stop this feeling, deep inside of me."},{"type":"line","text":"Girl, you just don't realize, what you do to me."},{"type":"line","text":"When you hold me, in your arms so tight,"},{"type":"line","text":"You let me know, everything's alright.."},{"type":"chorus","lines":["I-I-I-I I'm hooked on a feeling,","I'm high on believing,","That you're in love with m...e."]},{"type":"line","text":"Lips as sweet as candy, its taste is on my mind."},{"type":"line","text":"Girl, you got me thirsty for another cup of wine."},{"type":"line","text":"got a bug from you, girl, but I don't need no cure,"},{"type":"line","text":"I just stay a victim , If I can for sure."},{"type":"line","text":"All the good love, when we're all alone,"},{"type":"line","text":"Keep it up girl, yeah you turn me on."},{"type":"chorus","lines":["I-I-I-I I'm hooked on a feeling,","I'm high on believing,","That you're in love with m...e."]},{"type":"line","text":"All the good love, when we're all alone,"},{"type":"line","text":"Keep it up girl, yeah you turn me on."},{"type":"chorus","lines":["I-I-I-I I'm hooked on a feeling,","I'm high on believing,","That you're in love with m...e.","Said I'm hooked on a feeling,","I'm high on believing,","That you're in love with m...e.","Said I'm hooked on a feeling,","I'm high on believing,","That you're in love with m...e."]}]},{"id":"song-5","title":"Hon gör allt för att göra mig lycklig","artist":"Tomas Ledin","blocks":[{"type":"line","text":"Oao-oh, oao-oh, aaa-o-oh"},{"type":"line","text":"Mmmh, den flickan hon gör allt för att göra mej lycklig."},{"type":"line","text":"Oao-oh, oao-oh, aaa-o-oh"},{"type":"line","text":"Mmmh, den flickan hon gör allt för att göra mej lycklig."},{"type":"line","text":"Mmmh, Pojkarna dom frågar: \"Vem är hon som vi sett dej"},{"type":"line","text":"Tillsammans med?"},{"type":"line","text":"Vad heter hon? Vad gör hon? Vart kommer hon ifrån?"},{"type":"line","text":"Tala om för oss vem den flickan är.\""},{"type":"chorus","lines":["Hon är flickan som gör allt för att göra mej lycklig","Flickan som bara vill mej väl.","Hon är flickan som gör allt för att göra mej lycklig","Den enda flickan för min rastlösa själ.","Oao-oh, oao-oh, aaa-o-oh","Mmmh, den flickan hon gör allt för att göra mej lycklig.","Oao-oh, oao-oh, aaa-o-oh","Mmmh, den flickan hon gör allt för att göra mej lycklig."]},{"type":"line","text":"Mmmh, pojkarna dom ringer"},{"type":"line","text":"Är hon verkligen flickan du väntat på?"},{"type":"line","text":"Vad ska ni göra, vad kan hon, du tröttnar säkert snart?"},{"type":"line","text":"Jag kan inte få, pojkarna att förstå"},{"type":"chorus","lines":["Hon är flickan som gör allt för att göra mej lycklig","Flickan som bara vill mej väl.","Hon är flickan som gör allt för att göra mej lycklig","Den enda flickan för min rastlösa själ.","Oao-oh, oao-oh, aaa-o-oh","Mmmh, den flickan hon gör allt för att göra mej lycklig.","Oao-oh, oao-oh, aaa-o-oh","Mmmh, den flickan hon gör allt för att göra mej lycklig."]},{"type":"line","text":"Hon har en blick som kan bränna ner skogar"},{"type":"line","text":"En tunga som bara ger."},{"type":"line","text":"Hon har fickorna fulla av kärlek,"},{"type":"line","text":"Hon har en mun som bara vill ha mer."},{"type":"chorus","lines":["Hon är flickan som gör allt för att göra mej lycklig","Flickan som bara vill mej väl.","Hon är flickan som gör allt för att göra mej lycklig","Den enda flickan för min rastlösa själ.","Oao-oh, oao-oh, aaa-o-oh","Mmmh, den flickan hon gör allt för att göra mej lycklig.","Oao-oh, oao-oh, aaa-o-oh","Mmmh, den flickan hon gör allt för att göra mej lycklig."]}]},{"id":"song-6","title":"Hela Huset","artist":"Veronica o Håkan","blocks":[{"type":"line","text":"Min bleka kind är svart av smink"},{"type":"line","text":"Hör hela huset sova tungt"},{"type":"line","text":"Finns inget jag behöver som är nån annanstans"},{"type":"line","text":"Jag skulle kunna dö nu, med kinden mot din hals"},{"type":"line","text":"Jag reser m
